<script>
  // Base path: "/" on a custom domain, "/<repo>/" on a github.io project page. Restores routes sent here by 404.html (?r=).
  (function () {
    var l = location;
    var seg = l.hostname.endsWith('github.io') ? l.pathname.split('/')[1] : '';
    window.CW_BASE = seg ? '/' + seg + '/' : '/';
    document.write('<base href="' + window.CW_BASE + '">');
    var p = new URLSearchParams(l.search);
    if (p.has('r')) {
      var r = p.get('r'); p.delete('r');
      var q = p.toString();
      history.replaceState(null, '', window.CW_BASE + r + (q ? '?' + q : '') + l.hash);
    }
  })();
</script>
